# A repository whose invariants all hold. memlint must exit 0 here with one
# green line and no findings.

[mirrors]
pairs = [
  ["CLAUDE.md", "docs/CLAUDE.md"],
  ["sync/left", "sync/right"],
]

[blocks]
files = ["AGENTS.md"]
start = "<!-- AGENT:START -->"
end = "<!-- AGENT:END -->"

# The glob entry exercises glob expansion in files: it must match
# memory/index.md and produce no findings.
[pointers]
files = ["memory/*.md"]
roots = ["memory", "docs"]

[junk]
globs = ["*.tmp", ".DS_Store"]

[tokens]
watch = ["memory/*.md"]
budget = 200

# Every id at the start of a line is unique. A gap (D-002) is fine.
[ids]
files = ["memory/decisions.md"]
