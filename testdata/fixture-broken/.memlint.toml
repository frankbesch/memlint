# Fixture with eight planted RED defects and four planted YELLOW defects.
# See README.md in this directory for the inventory.
#
# [append_only] is deliberately absent: a committed fixture file always equals
# its own HEAD blob, so a static fixture cannot express a violation. That rule
# is covered by internal/lint/appendonly_test.go, which builds real git repos.
# [human_brief] is absent for the same reason: fixture files are committed by
# this repository's human author, so a static fixture cannot express an
# agent-authored commit. Covered by internal/lint/humanbrief_test.go.

[mirrors]
pairs = [
  ["CLAUDE.md", "docs/CLAUDE.md"],
  ["sync/left", "sync/right"],
]

[blocks]
files = ["AGENTS.md", "docs/generated.md"]
start = "<!-- AGENT:START -->"
end = "<!-- AGENT:END -->"

# The second files entry is a glob that deliberately matches nothing: a
# stale source glob is pointer coverage that silently never runs, and must
# be reported, not skipped — the same posture as the [tokens] watch glob.
[pointers]
files = ["memory/index.md", "notes/*.md"]
roots = ["memory", "docs"]

[junk]
globs = ["*.tmp"]

# The second watch glob deliberately matches nothing: a stale glob is a
# budget check that silently never runs, and must be reported, not skipped.
[tokens]
watch = ["memory/*.md", "notes/missing/*.md"]
budget = 200
