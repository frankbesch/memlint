name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:" && echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: go build -o ./memvet .

      # The fixtures are the acceptance contract: exact finding counts and
      # exact exit codes. A rule that over-reports or goes quiet fails here.
      - name: acceptance — broken fixture exits 1 with 10 red, 4 yellow
        run: |
          set +e
          out=$(./memvet check --no-color testdata/fixture-broken)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ]
          echo "$out" | tail -1 | grep -q "^memvet: 10 red, 4 yellow"

      - name: acceptance — clean fixture exits 0
        run: |
          out=$(./memvet check --no-color testdata/fixture-clean)
          echo "$out"
          echo "$out" | grep -q "^memvet: clean"

      - name: acceptance — dupids fixture exits 1 with 2 red, 0 yellow
        run: |
          set +e
          out=$(./memvet check --no-color testdata/fixture-dupids)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ]
          echo "$out" | tail -1 | grep -q "^memvet: 2 red, 0 yellow"

      - name: acceptance — yellow fixture exits 0, fails under --strict
        run: |
          ./memvet check --no-color testdata/fixture-yellow
          set +e
          ./memvet check --no-color --strict testdata/fixture-yellow
          code=$?
          set -e
          [ "$code" -eq 1 ]

      # The recipes in docs/recipes.md are the directories under examples/.
      # Each is held to the result its recipe states (details in
      # internal/cli/examples_test.go; this step is the visible receipt).
      - name: examples — recipes produce the results they claim
        run: |
          for e in minimal shared-instructions; do
            ./memvet check --no-color "examples/$e" | tail -1 | grep -q "^memvet: clean" || exit 1
          done
          set +e
          out=$(./memvet check --no-color examples/broken); code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ]
          echo "$out" | tail -1 | grep -q "^memvet: 1 red, 1 yellow"

      - name: self-check — memvet runs clean on its own repository
        run: ./memvet check --no-color --strict .

  # v0.11 part 4, G1: the composite action must produce annotations on a
  # real run. examples/broken has 1 red 1 yellow, so the step must fail
  # with exit 1 and nothing else. `uses: ./` runs this checkout's
  # action.yml with the latest released binary.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: memvet
        uses: ./
        with:
          path: examples/broken
        continue-on-error: true
      - name: the action must fail on the broken example
        run: |
          test "${{ steps.memvet.outcome }}" = "failure"
