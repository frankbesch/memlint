name: Bug report
description: memlint reported something wrong, missed something it should have caught, or crashed.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: memlint version
      description: Output of `memlint --version`.
      placeholder: memlint v0.9.1
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: .memlint.toml
      description: The config in use, trimmed to the rule involved.
      render: toml
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: The command you ran, its output, and what you expected instead. `memlint check --no-color --format json` output is ideal.
      render: text
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Minimal tree
      description: The smallest set of files that reproduces it, if you can share them.
      render: text
