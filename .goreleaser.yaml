# Release automation. Runs from .github/workflows/release.yml on tag push.
#
# The ldflags -X symbol below is pinned by TestVersionInjection in
# internal/cli/cli_test.go: renaming cli.version fails tests before it can
# silently break a release. {{ .Tag }} (not {{ .Version }}) keeps the leading
# "v" so released binaries print the same shape as `go install` builds.
version: 2

project_name: memlint

builds:
  - env:
      - CGO_ENABLED=0
    # Only platforms CI actually tests. No windows binaries until windows is
    # in the CI matrix — an untested artifact is a support burden, not a favor.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/frankbesch/memlint/internal/cli.version={{ .Tag }}

archives:
  - files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^spec:"
      - "^ci:"
      - "^test:"

# Publishing the cask needs two things that live outside this repo: the
# frankbesch/homebrew-tap repository, and a TAP_GITHUB_TOKEN secret with write
# access to it. Until both exist, a tag push will fail at this step — that is
# deliberate; a release that silently skips its own install path is worse.
homebrew_casks:
  - repository:
      owner: frankbesch
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/frankbesch/memlint
    description: Invariant checker for file-based agent memory
    # The binaries are not notarized, so strip the quarantine bit Gatekeeper
    # would otherwise use to block the first run.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/memlint"]
          end

release:
  footer: |
    ---
    Install with `go install github.com/frankbesch/memlint@{{ .Tag }}`, or
    download a binary above and verify it against `checksums.txt`.
