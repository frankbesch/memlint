# memlint as a GitHub Action. Downloads a released binary for the runner,
# verifies it against the checksums goreleaser publishes, and runs check with
# annotations on. The binary is the same one `brew` and `go install` give you;
# this file only fetches it.
name: memlint
description: Integrity checks for file-based AI agent state (memory, instructions, decisions, contracts)
author: Frank Besch
branding:
  icon: check-square
  color: green

inputs:
  path:
    description: Directory to check (where .memlint.toml lives, or where one would be inferred)
    required: false
    default: "."
  strict:
    description: Treat YELLOW findings as failures (also fails a run that had to infer its config)
    required: false
    default: "false"
  base:
    description: Git ref to compare [append_only] files against (e.g. the pull request base sha)
    required: false
    default: ""
  version:
    description: Release to run, e.g. v0.11.0, or "latest"
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Download memlint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux)  os=linux ;;
          Darwin) os=darwin ;;
          *) echo "memlint action: unsupported OS $(uname -s)"; exit 2 ;;
        esac
        case "$(uname -m)" in
          x86_64)        arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "memlint action: unsupported arch $(uname -m)"; exit 2 ;;
        esac
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(gh release view --repo frankbesch/memlint --json tagName --jq .tagName)
        fi
        # goreleaser's default archive name: memlint_0.11.0_linux_amd64.tar.gz
        archive="memlint_${VERSION#v}_${os}_${arch}.tar.gz"
        dir="$RUNNER_TEMP/memlint"
        mkdir -p "$dir"
        gh release download "$VERSION" --repo frankbesch/memlint --pattern "$archive" --pattern checksums.txt --dir "$dir" --clobber
        (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
        tar -xzf "$dir/$archive" -C "$dir" memlint
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/memlint" --version

    - name: memlint check
      shell: bash
      env:
        STRICT: ${{ inputs.strict }}
        BASE: ${{ inputs.base }}
        TARGET: ${{ inputs.path }}
      run: |
        set -euo pipefail
        args=()
        [ "$STRICT" = "true" ] && args+=(--strict)
        [ -n "$BASE" ] && args+=(--base "$BASE")
        memlint check --format github "${args[@]}" "$TARGET"
